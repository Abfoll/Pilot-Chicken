services:
  - type: web
    name: pilot-chicken-backend
    runtime: node
    repo: https://github.com/yourusername/pilot-chicken
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_HOST
        fromDatabase:
          name: pilot-chicken-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pilot-chicken-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: pilot-chicken-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pilot-chicken-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: pilot-chicken-db
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: SERVER_SEED
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: REDIS_HOST
        value: your-redis-host
      - key: REDIS_PORT
        value: 6379
    databases:
      - name: pilot-chicken-db
        plan: starter