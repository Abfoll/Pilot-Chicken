services:
  - type: web
    name: pilot-chicken-backend
    runtime: node
    region: frankfurt
    repo: https://github.com/Abfoll/Pilot-Chicken
    buildCommand: cd backend && npm ci && npm run build
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SERVER_SEED
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: REDIS_HOST
        value: your-redis-host
      - key: REDIS_PORT
        value: 6379